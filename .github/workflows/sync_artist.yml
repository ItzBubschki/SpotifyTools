name: Sync Artist Recent Tracks

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: sync_artist
    env:
      SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
      SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
      SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
      SPOTIPY_REFRESH_TOKEN: ${{ secrets.SPOTIPY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install spotipy python-dotenv
      - name: Run sync script
        run: python sync_artist_recent_to_playlist.py 3dszargYpFZjGo6vpjHNQS 1ca7PBIi8o9YaOJOyDze7y